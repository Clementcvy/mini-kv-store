name: CI

on: 
    push:
    pull_request:

jobs:
    quality-and-unit-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: "3.12"
                cache: pip
            
            - name: Install dependencies
              run: pip install -e ".[dev]"

            - name: Run Ruff
              run: |
                ruff check .
                ruff format --check .

            - name: Run unit tests
              run: pytest tests/unit -v
            

    integration-tests:
        runs-on: ubuntu-latest

        needs: quality-and-unit-tests

        services:
            postgres:
                image: postgres:16

                env: 
                    POSTGRES_USER: kvstore
                    POSTGRES_PASSWORD: kvstore
                    POSTGRES_DB: mini_kv_store

                ports:
                    - 5432:5432
                
                options:
                    --health-cmd "pg_isready -U kvstore -d mini_kv_store"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: "3.12"
                cache: pip

            - name: Install dependencies
              run: pip install -e ".[dev]"

            - name: Initialize database
              env:
                PGPASSWORD: kvstore
              run: psql -h localhost -U kvstore -d mini_kv_store -f db/init.sql

            - name: Run integration tests
              env:
                DATABASE_URL: postgresql://kvstore:kvstore@localhost:5432/mini_kv_store
              run: pytest tests/integration -v